# Render Blueprint: a staging copy of the site.
#
# Render dashboard > New > Blueprint > pick this repository > Apply.
# Every push to main redeploys it. See deploy/render/README.md.

services:
  - type: web
    name: rian-cullet
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Random, generated by Render on first deploy. Log in to wp-admin
      # as "admin" with it: Dashboard > rian-cullet > Environment.
      - key: WP_ADMIN_PASSWORD
        generateValue: true
